# Workspace indicator OSD — frosted-glass pill at bottom-centre
layerrule = blur on, match:namespace workspace-indicator
layerrule = ignore_alpha 0.3, match:namespace workspace-indicator

# Manual peek keybind
bindd = $mainMod, grave, Show workspace indicator, exec, pkill -SIGUSR1 -f workspace-indicator

# Session autostart
exec-once = bash -lc 'command -v workspace-indicator-focusd >/dev/null 2>&1 && workspace-indicator-focusd >/dev/null 2>&1' &
exec-once = bash -lc 'command -v systemctl >/dev/null 2>&1 && systemctl --user start workspace-indicator.service' &
