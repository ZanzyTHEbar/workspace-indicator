# Workspace indicator OSD — frosted-glass pill
layerrule = blur on, match:namespace workspace-indicator
layerrule = ignore_alpha 0.3, match:namespace workspace-indicator

# Manual peek keybind
bindd = $mainMod, grave, Show workspace indicator, exec, workspace-indicator --peek

# Session autostart
exec-once = bash -lc 'command -v systemctl >/dev/null 2>&1 && systemctl --user start workspace-indicator.service' &
