name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libgtk-layer-shell-dev

      - name: Run unit tests
        run: cargo test

      - name: Build and package release tarball
        run: make dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" workspace-indicator-linux-x86_64.tar.gz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" workspace-indicator-linux-x86_64.tar.gz --generate-notes
          fi
