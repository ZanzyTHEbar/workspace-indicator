name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Install musl cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Run unit tests
        run: cargo test

      - name: Build static x86_64 and aarch64 release tarballs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          make dist RUST_TARGET=x86_64-unknown-linux-musl ARCH_SUFFIX=x86_64
          make dist RUST_TARGET=aarch64-unknown-linux-musl ARCH_SUFFIX=aarch64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              workspace-indicator-linux-x86_64.tar.gz \
              workspace-indicator-linux-aarch64.tar.gz \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              workspace-indicator-linux-x86_64.tar.gz \
              workspace-indicator-linux-aarch64.tar.gz \
              --generate-notes
          fi
